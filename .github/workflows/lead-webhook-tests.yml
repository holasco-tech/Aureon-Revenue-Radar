name: Lead webhook tests
on:
  workflow_dispatch:
  push:
    branches: [audit/sales-recovery-integration]
  pull_request:
    paths:
      - 'integration/**'
      - 'tests/**'
      - '.github/workflows/lead-webhook-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker.js
      - run: node --test tests/*.test.mjs
      - name: Install bundler
        run: npm install --no-save --ignore-scripts esbuild@0.25.12
      - name: Bundle Worker for test environment
        run: node scripts/build-isolated-worker.mjs
      - name: Check bundle syntax
        run: node --check dist/aureon-radar-integration-test.mjs

      - name: Upload isolated test bundle
        uses: actions/upload-artifact@v4
        with:
          name: aureon-radar-isolated-worker
          path: dist/aureon-radar-integration-test.mjs
          retention-days: 7
